<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Хозблок 6×2,3 — 3D</title>
<style>
  html, body { margin: 0; height: 100%; background: #dfe8ef; font: 14px/1.3 system-ui, sans-serif; overflow: hidden; }
  #bar { position: absolute; top: 10px; left: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
  #bar button { border: 0; border-radius: 6px; padding: 7px 11px; background: #ffffffd9; cursor: pointer; }
  #bar button.on { background: #1f4a3a; color: #fff; }
  body.shot #bar { display: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="bar"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { buildMaterials, buildHouse, buildSite, addLights, skyTexture } from './scene.js';

const q = new URLSearchParams(location.search);
const shot = q.has('shot');
if (shot) document.body.classList.add('shot');
const model = await (await fetch(q.get('model') || '../model/model.json')).json();

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(shot ? 1 : Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = !q.has('noshadow');
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = skyTexture();
THREE.Object3D.DEFAULT_UP.set(0, 0, 1);
const M = buildMaterials({ wallColor: q.get('color') || undefined });
const house = buildHouse(model, M);
scene.add(house.root);
const site = buildSite(model, M);
scene.add(site);
const lights = addLights(scene);

const lamps = [];
for (const e of model.elements.filter(e => e.type === 'lamp')) {
  const l = new THREE.PointLight('#fff4e0', 0, 4200, 0);
  l.position.set(e.x, e.y, e.z - 120); scene.add(l); lamps.push(l);
}

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 50, 100000);
camera.up.set(0, 0, 1);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

const hideSets = {
  cut: ['roof', 'frame_roof', 'ceiling', 'clad_front', 'finish_front', 'frame_front', 'openings', 'lamps'],
  frame: ['cladding', 'clad_front', 'finish', 'finish_front', 'ceiling', 'openings', 'equip', 'floor', 'site', 'roof_sheet'],
};
function setVisible(hide = []) {
  for (const [k, g] of Object.entries(house.groups)) g.visible = !hide.includes(k);
  house.root.getObjectByName('roof_sheet').visible = !hide.includes('roof_sheet');
  for (const n of ['lamp0', 'lamp1']) house.root.getObjectByName(n).visible = !hide.includes('lamps');
}

const VIEWS = {
  ext_front: { label: 'Снаружи', pos: [-3900, -7600, 2300], look: [2600, 1000, 1150], fov: 38 },
  ext_back: { label: 'Сзади', pos: [9800, 7600, 2600], look: [2900, 1100, 1250], fov: 36, sun: [9000, 8000, 9000] },
  ext_side: { label: 'Фасад', pos: [2900, -9800, 1500], look: [2900, 1100, 1350], fov: 32 },
  int_bench: { label: 'Внутри: мастерская', pos: [3350, 850, 1650], look: [0, 1100, 950], fov: 72, inside: true },
  int_tech: { label: 'Внутри: инвентарь', pos: [2250, 1150, 1650], look: [5700, 850, 800], fov: 70, inside: true },
  int_back: { label: 'Внутри: задняя стена', pos: [2900, 160, 1500], look: [2900, 2100, 1150], fov: 84, inside: true },
  cut: { label: 'Разрез', pos: [2900, -5400, 7200], look: [2900, 1150, 500], fov: 36, hide: hideSets.cut, inside: true },
  frame: { label: 'Каркас', pos: [-2300, -4600, 4300], look: [2900, 1100, 1100], fov: 38, hide: hideSets.frame, bg: '#eef2f5' },
};

function setView(name) {
  const v = VIEWS[name];
  setVisible(v.hide || []);
  camera.position.set(...v.pos);
  controls.target.set(...v.look);
  camera.fov = v.fov; camera.updateProjectionMatrix();
  controls.update();
  lamps.forEach(l => (l.intensity = v.inside ? 2.2 : 0));
  lights.hemi.intensity = v.inside ? 1.2 : 0.9;
  lights.hemi.groundColor.set(v.inside ? '#cdbb98' : '#6b5d45');
  lights.sun.position.set(...(v.sun || [-6000, -9000, 9000]));
  site.visible = true;
  scene.background = v.bg ? new THREE.Color(v.bg) : skyTexture();
  if (v.bg) site.visible = false;
  document.querySelectorAll('#bar button').forEach(b => b.classList.toggle('on', b.dataset.v === name));
}

const bar = document.getElementById('bar');
for (const [k, v] of Object.entries(VIEWS)) {
  const b = document.createElement('button'); b.textContent = v.label; b.dataset.v = k;
  b.onclick = () => setView(k); bar.appendChild(b);
}
setView(q.get('view') || 'ext_front');

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
function loop() { controls.update(); renderer.render(scene, camera); if (!shot) requestAnimationFrame(loop); }
loop();
if (q.has('dump')) {
  // габариты всех деталей для чертежей (drawings/make_drawings.py)
  const out = [];
  house.root.updateMatrixWorld(true);
  for (const [gname, grp] of Object.entries(house.groups)) for (const top of grp.children) {
    top.traverse(o => {
      if (!o.isMesh) return;
      const b = new THREE.Box3().setFromObject(o);
      out.push({ id: top.name, group: gname, mat: Object.keys(M).find(k => M[k] === o.material) || '',
        b: [b.min.x, b.min.y, b.min.z, b.max.x, b.max.y, b.max.z].map(v => Math.round(v * 10) / 10) });
    });
  }
  window.__dump = out;
}
if (shot) { renderer.render(scene, camera); window.__ready = true; }
</script>
</body>
</html>
